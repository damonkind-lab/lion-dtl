<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="gold" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#d8b04a"/>
      <stop offset="1" stop-color="#8b5a14"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#d9b253"/>
      <stop offset="1" stop-color="#8b5a14"/>
    </linearGradient>
    <radialGradient id="dark" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1a1a22"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- coin base -->
  <circle cx="16" cy="16" r="15" fill="url(#gold)"/>
  <circle cx="16" cy="16" r="13.6" fill="url(#dark)"/>
  <circle cx="16" cy="16" r="12.9" fill="none" stroke="url(#gold2)" stroke-width="0.8" opacity="0.95"/>

  <!-- dotted ring (like coin pattern) -->
  <g fill="url(#gold2)" opacity="0.85">
    <circle cx="16" cy="3.9" r="0.55"/>
    <circle cx="22.1" cy="5.3" r="0.55"/>
    <circle cx="26.7" cy="9.6" r="0.55"/>
    <circle cx="28.1" cy="15.8" r="0.55"/>
    <circle cx="26.7" cy="22.0" r="0.55"/>
    <circle cx="22.1" cy="26.3" r="0.55"/>
    <circle cx="16" cy="27.7" r="0.55"/>
    <circle cx="9.9" cy="26.3" r="0.55"/>
    <circle cx="5.3" cy="22.0" r="0.55"/>
    <circle cx="3.9" cy="15.8" r="0.55"/>
    <circle cx="5.3" cy="9.6" r="0.55"/>
    <circle cx="9.9" cy="5.3" r="0.55"/>
  </g>

  <!-- shield frame -->
  <g filter="url(#shadow)">
    <path d="M16 6.2
             L23.6 9.4
             V16.6
             C23.6 21.8 20.4 24.9 16 26.2
             C11.6 24.9 8.4 21.8 8.4 16.6
             V9.4 Z"
          fill="none" stroke="url(#gold2)" stroke-width="1.1" opacity="0.95"/>
    <path d="M16 7.4
             L22.3 10.0
             V16.4
             C22.3 21.0 19.5 23.7 16 24.8
             C12.5 23.7 9.7 21.0 9.7 16.4
             V10.0 Z"
          fill="#0b0b10" opacity="0.65"/>
  </g>

  <!-- crown -->
  <path d="M12.2 10.0
           L13.7 8.6
           L16 10.1
           L18.3 8.6
           L19.8 10.0
           L19.3 12.0
           H12.7 Z"
        fill="url(#gold2)" filter="url(#shadow)"/>
  <rect x="12.7" y="12.0" width="6.6" height="1.1" rx="0.4" fill="url(#gold2)" opacity="0.95"/>

  <!-- lion head (geometric) -->
  <g filter="url(#shadow)">
    <!-- mane -->
    <path d="M16 11.2
             L12.3 12.8
             L10.9 16.0
             L12.2 19.8
             L16 21.8
             L19.8 19.8
             L21.1 16.0
             L19.7 12.8 Z"
          fill="url(#gold2)" opacity="0.95"/>
    <!-- face -->
    <path d="M16 12.4
             L13.7 13.4
             L12.8 15.7
             L13.8 18.4
             L16 19.7
             L18.2 18.4
             L19.2 15.7
             L18.3 13.4 Z"
          fill="#0b0b10" opacity="0.9"/>
    <path d="M16 12.9
             L14.4 14.0
             L14.0 15.8
             L15.1 17.8
             L16 18.4
             L16.9 17.8
             L18.0 15.8
             L17.6 14.0 Z"
          fill="url(#gold2)"/>

    <!-- eyes -->
    <path d="M14.5 15.3 L15.6 14.9 L15.1 15.8 Z" fill="#0b0b10"/>
    <path d="M17.5 15.3 L16.4 14.9 L16.9 15.8 Z" fill="#0b0b10"/>

    <!-- nose / mouth -->
    <path d="M16 16.6 L15.2 17.2 L16 17.6 L16.8 17.2 Z" fill="#0b0b10" opacity="0.9"/>
    <path d="M15.1 17.8 C15.6 18.4 16.4 18.4 16.9 17.8" fill="none" stroke="#0b0b10" stroke-width="0.55" stroke-linecap="round"/>
  </g>

  <!-- small side arrows like your coin -->
  <path d="M6.2 16 L8.3 14.9 V17.1 Z" fill="url(#gold2)" opacity="0.9"/>
  <path d="M25.8 16 L23.7 14.9 V17.1 Z" fill="url(#gold2)" opacity="0.9"/>
</svg>
